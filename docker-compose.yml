services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: chiahsin
      POSTGRES_PASSWORD: chiahsin
      POSTGRES_DB: chiahsin
    ports:
      - "5432:5432"
    volumes:
      - chiahsin_db_data:/var/lib/postgresql/data

volumes:
  chiahsin_db_data:
